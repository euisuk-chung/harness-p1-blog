# 블로그 자동화의 흐름도 — "허용된 경로" 의 전부다. 여기 없는 길로는 가지 못한다.
#
# 단계 이름은 업무 말: 수집(collect) → 작성(draft) → 검수(review) → 승인(approve).
# 요청(request)은 흐름 밖의 scripts/request.sh 가 만들고, 전달(발행)은 사람이 PR 을 합칠 때 일어난다.
#
# 누가 하나(by)
#   script   차단 장치 next_step.py · run_review.py 가 그 명령을 직접 실행한다. 모델을 부르지 않는다
#   drafter  Claude 가 하위 에이전트 drafter 에게 맡긴다. 여기서만 모델이 일한다
#
# 다음에 어디로 갈지는 단계가 끝날 때 남기는 신호(숫자)가 정한다. 출력 글을 읽어 판단하지 않는다.
#   0 됐다 / 1 검수가 거부 / 2 형식 위반 / 3 사람 차례 / 64 실행 환경 문제
#
# 키를 `on:` 이라고 쓰지 않는다 — YAML 에서 on 은 true 로 읽힌다. 그래서 next: 다.
#
# [승인까지 더한 판]
# 검수가 거부하면 작성으로 되돌아가고, 세 번 해도 안 되면 사람에게.
# 검수를 통과하면 초안을 브랜치에 올리고 PR 을 연 뒤 사람의 승인(PR 합치기)을 기다린다.

start: collect

steps:
  collect:
    by: script
    run: uv run python scripts/collect.py {id}
    next:
      0: draft
      64: failed

  draft:
    by: drafter
    ask: "요청 {id} 의 블로그 초안을 쓰게 하세요. 읽을 것 requests/{id}/sources/ 의 원문과 requests/{id}/brief.json, 쓸 곳 requests/{id}/draft.json."
    retry_hint: "원문에 없는 문장을 인용하거나 원문을 고쳐 통과시키려 하지 마세요. 못 고친 곳은 그대로 둔 채 초안을 다시 쓰세요 — 그래도 거부되면 사람에게 넘어가는 것이 맞는 결과입니다."
    max_visits: 3
    when_exhausted: needs_human
    next:
      0: review

  review:
    by: script
    run: uv run python review.py --request {id}
    next:
      0: approve
      1: draft
      2: failed

  approve:
    by: script
    # 초안을 글로 만들어 브랜치에 올리고 PR 을 연다. 합치는 것은 사람이다 — 3 은 "사람 차례" 로 멈춘다.
    run: uv run python scripts/request_approval.py {id}
    next:
      3: needs_human
      64: failed

terminal:
  - published
  - needs_human
  - failed

max_steps: 12
